<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Love Memory Magic Premium</title>
<style>*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#000;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

/* Top Bar */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    font-size:18px;
    font-weight:600;
}

/* Message */

#msg{
    text-align:center;
    padding:10px;
    font-size:18px;
    color:#ff80bf;
}

/* Grid */

#grid{
    width:min(95vw,900px);
    margin:auto;
    padding:15px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

/* Card */

.card{
    aspect-ratio:3/4;
    cursor:pointer;
    perspective:1000px;
}

/* Flip Container */

.inner{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:0.8s;
}

/* Flip */

.card.flip .inner{
    transform:rotateY(180deg);
}

/* Both Faces */

.front,
.back{
    position:absolute;
    inset:0;
    border-radius:24px;
    overflow:hidden;
    backface-visibility:hidden;
}

/* Front */

.front{
    background:linear-gradient(
        135deg,
        #ff4da6,
        #7b61ff
    );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:2rem;

    box-shadow:
    0 0 20px rgba(255,77,166,.5),
    0 0 40px rgba(123,97,255,.3);

    border:2px solid rgba(255,255,255,.15);
}

/* Back */

.back{
    transform:rotateY(180deg);
    background:#111;
}

.back img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Hover */

.card:hover{
    transform:translateY(-4px);
}

/* Floating Hearts */

.heart{
    position:fixed;
    pointer-events:none;
    opacity:.25;
    animation:floatUp linear infinite;
}

@keyframes floatUp{

    from{
        transform:translateY(110vh);
    }

    to{
        transform:translateY(-120px);
    }
}

/* Game Over */

#gameOver{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);

    display:none;

    justify-content:center;
    align-items:center;
    flex-direction:column;

    text-align:center;

    z-index:999;
}

#gameOver h1{
    color:#ff6ea8;
    margin-bottom:10px;
}

#gameOver h2{
    margin-bottom:20px;
}

button{
    padding:12px 22px;
    border:none;
    border-radius:12px;
    cursor:pointer;

    background:linear-gradient(
        135deg,
        #ff4da6,
        #7b61ff
    );

    color:white;
    font-weight:600;
}

/* Shuffle Animation */

.card.shuffling{
    animation:shuffleMove .5s ease-in-out;
}

@keyframes shuffleMove{

    0%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-15px);
    }

    50%{
        transform:translateX(15px);
    }

    75%{
        transform:translateX(-10px);
    }

    100%{
        transform:translateX(0);
    }
}

/* Mobile */

@media(max-width:768px){

    #grid{
        grid-template-columns:repeat(3,1fr);
        gap:10px;
    }

    .top{
        font-size:15px;
    }

    #msg{
        font-size:16px;
    }
}

@media(max-width:480px){

    #grid{
        gap:8px;
    }

    .front{
        font-size:1.5rem;
    }
}</style>

</head>
<body>

<div class="top">
<div>💖 Score: <span id="score">0</span></div>
<div>❤️ Lives: <span id="lives">3</span></div>
</div>
<div>🎯 Level: <span id="level">1</span></div>
<div id="msg">Pick a memory card ❤️</div>
<div class="grid" id="grid"></div>

<div class="overlay" id="over">
<h1>💔 Love Story Ended</h1>
<h2>Final Score: <span id="final"></span></h2>
<button onclick="location.reload()">Play Again</button>
</div>

<script>const TOTAL_IMAGES = 86;
const levelEl = document.getElementById("level");
const allImages = [];
for (let i = 1; i <= TOTAL_IMAGES; i++) {
    allImages.push(`Photos/${i}.jpg`);
}
let level = 1;
let shuffleDuration = 1500;
let score = 0;
let lives = 3;
let targetImage = "";
let phase = "pick";

const grid = document.getElementById("grid");
const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const msg = document.getElementById("msg");

function shuffle(arr) {
    return [...arr].sort(() => Math.random() - 0.5);
}

function startRound() {

    phase = "pick";
    targetImage = "";

    msg.innerText = "Pick a card and remember it ❤️";

    grid.innerHTML = "";

    const roundImages = shuffle(allImages).slice(0, 12);

    roundImages.forEach(src => {

        const card = document.createElement("div");

        card.className = "card";

        card.dataset.src = src;

        card.innerHTML = `
            <div class="inner">
                <div class="front">💕</div>
                <div class="back">
                    <img src="${src}">
                </div>
            </div>
        `;

        card.addEventListener("click", () => handleCard(card));

        grid.appendChild(card);

    });
}
const surpriseText = `
Yahan apna pura paragraph likho.

Jitna lamba likhna hai likho.

Dear Love ❤️,

Tum meri life ki sabse beautiful memory ho.
Har moment jo humne saath spend kiya hai wo mere liye special hai.

Thank you for being with me.
I love you forever 💖
`;
function handleCard(card) {

    const src = card.dataset.src;

    if (phase === "pick") {

        targetImage = src;

        phase = "remember";

        card.classList.add("flip");

        msg.innerText = "Remember this photo 💖";

        setTimeout(() => {

            card.classList.remove("flip");

            msg.innerText = "✨ Shuffling Cards... ✨";

            shuffleCards();

        }, 4000);

        return;
    }

    if (phase === "find") {

        phase = "checking";

        if (src === targetImage) {

            score++;
level++;

scoreEl.textContent = score;
levelEl.textContent = level;

shuffleDuration = Math.max(
    300,
    shuffleDuration - 100
);

            

            card.classList.add("flip");

            msg.innerText = "Correct! 💖";

            setTimeout(() => {

                startRound();

            }, 1500);

        } else {

            lives--;

            livesEl.textContent = lives;

            card.animate([
                { transform: "translateX(-10px)" },
                { transform: "translateX(10px)" },
                { transform: "translateX(-10px)" },
                { transform: "translateX(0)" }
            ], {
                duration: 400
            });

            msg.innerText = "Wrong Card 💔";

            if (lives <= 0) {

                gameOver();

            } else {

                setTimeout(() => {

                    startRound();

                }, 1500);

            }
        }
    }
}

function shuffleCards() {

    const cards = [...document.querySelectorAll(".card")];

    cards.forEach(card => {
        card.style.pointerEvents = "none";
    });

    const firstPositions = new Map();

    cards.forEach(card => {
        firstPositions.set(
            card,
            card.getBoundingClientRect()
        );
    });

    const shuffled = shuffle(cards);

    shuffled.forEach(card => {
        grid.appendChild(card);
    });

    cards.forEach(card => {

        const first = firstPositions.get(card);

        const last = card.getBoundingClientRect();

        const dx = first.left - last.left;
        const dy = first.top - last.top;

        card.animate(
            [
                {
                    transform: `translate(${dx}px, ${dy}px)`
                },
                {
                    transform: "translate(0,0)"
                }
            ],
            {
                duration:shuffleDuration,
                easing: "ease-in-out"
            }
        );

    });

    setTimeout(() => {

        cards.forEach(card => {
            card.style.pointerEvents = "auto";
        });

        phase = "find";

        msg.innerText = "Find the same memory again ❤️";

    }, 1600);
}

function gameOver() {

    phase = "gameover";

    const over = document.getElementById("gameOver");

    const finalScore =
        document.getElementById("finalScore");

    if (finalScore) {
        finalScore.textContent = score;
    }

    if (over) {
        over.style.display = "flex";
    } else {

        alert(
            `Game Over 💔\nScore: ${score}`
        );

        location.reload();
    }
}

function restartGame() {

    score = 0;
    lives = 3;

    scoreEl.textContent = score;
    livesEl.textContent = lives;

    document.getElementById("gameOver")
        ?.style.setProperty("display", "none");

    startRound();
}

startRound();</script>
</body>
</html>
