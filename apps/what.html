<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Love Connect ❤️</title>

<link rel="stylesheet" href="love-connect.css">
<style>/* ===========================
   Google Font
=========================== */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#ff6aa2,#ff9ec7,#ffd4e5);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow-x:hidden;
    padding:20px;
}

/* ===========================
   Floating Hearts
=========================== */

.hearts{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-1;
}

.hearts::before,
.hearts::after{
    content:"❤️ 💖 💕 💗 💘";
    position:absolute;
    width:100%;
    font-size:30px;
    animation:floatHearts 25s linear infinite;
    opacity:.2;
}

.hearts::after{
    animation-delay:12s;
}

@keyframes floatHearts{

0%{
transform:translateY(100vh);
}

100%{
transform:translateY(-120vh);
}

}

/* ===========================
   Container
=========================== */

.container{
    width:100%;
    max-width:420px;
}

/* ===========================
   Glass Card
=========================== */

.card{

background:rgba(255,255,255,.18);

backdrop-filter:blur(25px);

-webkit-backdrop-filter:blur(25px);

border-radius:30px;

padding:30px 22px;

border:1px solid rgba(255,255,255,.25);

box-shadow:0 20px 50px rgba(0,0,0,.2);

}

/* ===========================
   Profile
=========================== */

.profile{
text-align:center;
}

.profile-img{

width:120px;
height:120px;

border-radius:50%;

object-fit:cover;

border:5px solid white;

box-shadow:0 10px 20px rgba(0,0,0,.15);

}

.profile h1{

margin-top:15px;

color:white;

font-size:28px;

}

.profile p{

margin-top:8px;

color:white;

opacity:.85;

}

/* ===========================
   Buttons
=========================== */

.buttons{

margin-top:30px;

display:flex;

flex-direction:column;

gap:15px;

}

.buttons button{

height:60px;

border:none;

border-radius:18px;

font-size:18px;

font-weight:600;

display:flex;

align-items:center;

justify-content:center;

gap:12px;

cursor:pointer;

transition:.35s;

color:white;

}

.buttons button i{

font-size:22px;

}

/* Individual Colors */

.love{
background:#ff2d75;
}

.miss{
background:#8e44ad;
}

.kiss{
background:#ff9800;
}

.hug{
background:#00b894;
}

.buttons button:hover{

transform:translateY(-3px);

box-shadow:0 10px 25px rgba(0,0,0,.25);

}

.buttons button:active{

transform:scale(.96);

}

/* ===========================
   Divider
=========================== */

.divider{

display:flex;

align-items:center;

margin:30px 0 20px;

color:white;

font-weight:600;

}

.divider::before,
.divider::after{

content:"";

flex:1;

height:1px;

background:rgba(255,255,255,.5);

}

.divider span{

padding:0 15px;

}

/* ===========================
   Quick Buttons
=========================== */

.actions{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:15px;

}

.actions button{

height:90px;

border:none;

border-radius:18px;

background:rgba(255,255,255,.25);

backdrop-filter:blur(10px);

cursor:pointer;

transition:.3s;

color:white;

}

.actions button:hover{

background:white;

color:#ff2d75;

transform:translateY(-5px);

}

.actions i{

font-size:28px;

margin-bottom:10px;

display:block;

}

.actions p{

font-size:15px;

font-weight:600;

}

/* ===========================
   Status
=========================== */

.status{

margin-top:25px;

display:flex;

justify-content:center;

align-items:center;

gap:10px;

color:white;

font-weight:600;

}

.status-dot{

width:12px;

height:12px;

background:#00ff88;

border-radius:50%;

animation:pulse 1s infinite;

}

@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.4);
}

100%{
transform:scale(1);
}

}

/* ===========================
   Popup
=========================== */

.popup{

position:fixed;

inset:0;

background:rgba(0,0,0,.55);

display:flex;

justify-content:center;

align-items:center;

visibility:hidden;

opacity:0;

transition:.3s;

padding:20px;

z-index:1000;

}

.popup.active{

visibility:visible;

opacity:1;

}

.popup-box{

width:320px;

background:white;

padding:30px;

border-radius:25px;

text-align:center;

animation:popup .35s;

}

@keyframes popup{

from{

transform:scale(.7);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}

.popup-icon{

font-size:55px;

margin-bottom:10px;

}

.popup h2{

color:#ff2d75;

}

.popup p{

margin:12px 0 20px;

}

.popup button{

width:100%;

height:50px;

border:none;

border-radius:15px;

background:#ff2d75;

color:white;

font-size:18px;

cursor:pointer;

}

/* ===========================
   Chat Box
=========================== */

.chat-box{

position:fixed;

bottom:20px;

right:20px;

width:320px;

max-height:450px;

background:white;

border-radius:20px;

overflow:hidden;

box-shadow:0 20px 50px rgba(0,0,0,.2);

display:none;

}

.chat-header{

background:#ff2d75;

color:white;

padding:15px;

display:flex;

align-items:center;

gap:12px;

}

.chat-header img{

width:45px;

height:45px;

border-radius:50%;

object-fit:cover;

}

.messages{

height:300px;

overflow-y:auto;

padding:15px;

background:#fff8fb;

}

/* ===========================
   Responsive
=========================== */

@media(max-width:600px){

body{
padding:12px;
}

.card{
padding:20px;
}

.profile-img{
width:95px;
height:95px;
}

.profile h1{
font-size:22px;
}

.buttons button{
height:55px;
font-size:16px;
}

.actions button{
height:80px;
}

.chat-box{

width:95%;

right:2.5%;

bottom:10px;

}

}</style>
<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>

</head>

<body>

<!-- Floating Hearts -->
<div class="hearts"></div>

<div class="container">

<div class="card">

<!-- Profile -->
<div class="profile">

<img src="/Photos/11.jpg" class="profile-img">

<h1>Ishika ❤️</h1>

<p>One Tap Away From My Heart</p>

</div>

<!-- Love Buttons -->

<div class="buttons">

<button id="loveBtn" class="love">
<i class="fa-solid fa-heart"></i>
<span>Love You</span>
</button>

<button id="missBtn" class="miss">
<i class="fa-solid fa-face-sad-tear"></i>
<span>Miss You</span>
</button>

<button id="kissBtn" class="kiss">
<i class="fa-solid fa-kiss-wink-heart"></i>
<span>Kiss Me</span>
</button>

<button id="hugBtn" class="hug">
<i class="fa-solid fa-hands-holding-heart"></i>
<span>Hug Me</span>
</button>

</div>

<!-- Divider -->

<div class="divider">
<span>Quick Connect</span>
</div>

<!-- Quick Actions -->

<div class="actions">

<button id="callBtn">
<i class="fa-solid fa-phone"></i>

<p>Call</p>
</button>

<button id="videoBtn">
<i class="fa-solid fa-video"></i>

<p>Video</p>
</button>

<button id="chatBtn">
<i class="fa-brands fa-whatsapp"></i>

<p>WhatsApp</p>
</button>

</div>

<!-- Status -->

<div class="status">

<div class="status-dot"></div>

<span>Online ❤️</span>

</div>

</div>

</div>

<!-- Success Popup -->

<div class="popup" id="popup">

<div class="popup-box">

<div class="popup-icon">

❤️

</div>

<h2>Message Sent</h2>

<p>Your love has been delivered 💖</p>

<button id="closePopup">

OK

</button>

</div>

</div>

<!-- Fake Chat -->

<div class="chat-box">

<div class="chat-header">

<img src="/Photos/11.jpg">

<div>

<h3>Rudra ❤️</h3>

<span>Typing...</span>

</div>

</div>

<div class="messages" id="messages">

<!-- JS Messages -->

</div>

</div>

<script>// =====================================
// Love Connect ❤️
// =====================================

// Replace with your WhatsApp number
const PHONE = "+917898053366";

// Buttons
const loveBtn = document.getElementById("loveBtn");
const missBtn = document.getElementById("missBtn");
const kissBtn = document.getElementById("kissBtn");
const hugBtn = document.getElementById("hugBtn");

const callBtn = document.getElementById("callBtn");
const videoBtn = document.getElementById("videoBtn");
const chatBtn = document.getElementById("chatBtn");

const popup = document.getElementById("popup");
const closePopup = document.getElementById("closePopup");

const messages = document.getElementById("messages");
const chatBox = document.querySelector(".chat-box");

// -------------------------
// Show Popup
// -------------------------

function showPopup(){

popup.classList.add("active");

}

// -------------------------
// Close Popup
// -------------------------

closePopup.onclick = ()=>{

popup.classList.remove("active");

}

// -------------------------
// Add Fake Reply
// -------------------------

function addReply(reply){

chatBox.style.display="block";

setTimeout(()=>{

messages.innerHTML += `
<div style="
background:#ffe4ef;
padding:12px;
margin-bottom:12px;
border-radius:15px;
max-width:85%;
animation:fade .4s;
">

<b style="color:#ff2d75;">❤️ Rudra</b><br><br>

${reply}

</div>
`;

messages.scrollTop=messages.scrollHeight;

},2500);

}

// -------------------------
// Send WhatsApp
// -------------------------

function sendWhatsApp(message,reply){

showPopup();

setTimeout(()=>{

window.open(
`https://wa.me/${PHONE}?text=${encodeURIComponent(message)}`,
"_blank"
);

},800);

addReply(reply);

}

// -------------------------
// Love
// -------------------------

loveBtn.onclick=()=>{

sendWhatsApp(

"❤️ I Love You",

"❤️ Love You Too Bubuuu..."

);

};

// -------------------------
// Miss
// -------------------------

missBtn.onclick=()=>{

sendWhatsApp(

"🥺 I Miss You",

"🥺 I Miss You Too Jaan..."

);

};

// -------------------------
// Kiss
// -------------------------

kissBtn.onclick=()=>{

sendWhatsApp(

"😘 Give Me A Kiss",

"😘 Come Here... Kiss For You 💋"

);

};

// -------------------------
// Hug
// -------------------------

hugBtn.onclick=()=>{

sendWhatsApp(

"🤗 I Need A Hug",

"🤗 Biggest Hug For My Bubuuu ❤️"

);

};

// -------------------------
// Phone Call
// -------------------------

callBtn.onclick=()=>{

window.location.href=`tel:+${PHONE}`;

};

// -------------------------
// Video Call
// -------------------------

videoBtn.onclick=()=>{

window.open(`https://wa.me/${PHONE}`,"_blank");

};

// -------------------------
// WhatsApp Chat
// -------------------------

chatBtn.onclick=()=>{

window.open(`https://wa.me/${PHONE}`,"_blank");

};

// -------------------------
// Fade Animation
// -------------------------

const style=document.createElement("style");

style.innerHTML=`

@keyframes fade{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}

`;

document.head.appendChild(style);</script>

</body>
</html>
