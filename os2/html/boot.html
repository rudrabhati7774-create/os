<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love OS Boot</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#000;
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.boot-screen{
text-align:center;
width:90%;
max-width:500px;
}

/* Moon */

.moon{
width:120px;
height:120px;
background:white;
border-radius:50%;
margin:auto;
box-shadow:
0 0 30px white,
0 0 60px white,
0 0 120px white;
animation:float 4s ease-in-out infinite;
}

@keyframes float{
50%{
transform:translateY(-15px);
}
}

/* Love OS */

.logo{
font-size:42px;
margin-top:30px;
font-weight:700;
letter-spacing:3px;
text-shadow:0 0 20px white;
}

.sub{
margin-top:10px;
color:#ccc;
font-size:14px;
}

/* Loading Bar */

.loading-box{
width:100%;
height:10px;
background:#111;
border-radius:50px;
overflow:hidden;
margin-top:50px;
}

.loading{
height:100%;
width:0%;
background:white;
box-shadow:0 0 20px white;
animation:load 12s linear forwards;
}

@keyframes load{
100%{
width:100%;
}
}

.message{
margin-top:30px;
font-size:18px;
min-height:30px;
color:#eee;
}

/* Heart */

.heart{
font-size:50px;
margin-top:30px;
opacity:0;
animation:heartbeat 1s infinite;
}

@keyframes heartbeat{
0%,100%{
transform:scale(1);
}
50%{
transform:scale(1.3);
}
}

/* Stars */

.star{
position:absolute;
background:white;
border-radius:50%;
animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
from{
opacity:.2;
}
to{
opacity:1;
}
}

</style>
</head>

<body>

<div class="boot-screen">

<div class="moon"></div>

<div class="logo">
Love OS
</div>

<div class="sub">
Booting Our Forever...
</div>

<div class="loading-box">
<div class="loading"></div>
</div>

<div class="message" id="msg">
Initializing...
</div>

<div class="heart" id="heart">
❤️
</div>

</div>

<script>

// Create Stars

for(let i=0;i<80;i++){

let star=document.createElement("div");
star.classList.add("star");

let size=Math.random()*3;

star.style.width=size+"px";
star.style.height=size+"px";

star.style.left=Math.random()*100+"vw";
star.style.top=Math.random()*100+"vh";

star.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(star);

}

const messages=[

"Searching for the most beautiful soul...",
"Connection Found ❤️",
"Loading Memories...",
"Collecting Smiles...",
"Synchronizing Heartbeats...",
"Unlocking Forever...",
"Preparing Moonlight...",
"Launching Our Love Story..."

];

let i=0;

const msg=document.getElementById("msg");

const interval=setInterval(()=>{

if(i<messages.length){

msg.innerText=messages[i];
i++;

}

},1500);

setTimeout(()=>{

document.getElementById("heart").style.opacity="1";

msg.innerHTML=`
System Ready ❤️<br>
Welcome Back My Love
`;

clearInterval(interval);

},12000);

// Redirect

setTimeout(()=>{
window.location.href="/os2/html/lock.html";
},15000);

</script>

</body>
</html>
