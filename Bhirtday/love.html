<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Love ❤️</title>

<style>
body{
  margin:0;
  background:black;
  font-family:'Segoe UI',sans-serif;
  color:white;
  overflow-x:hidden;
}

/* TITLE */
h1{
  text-align:center;
  color:#ff4d6d;
  margin:20px 0;
  font-size:32px;
  animation:fadeIn 2s ease;
}

/* GRID */
.videoGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:10px;
}

.videoGrid video{
  width:100%;
  border-radius:15px;
  box-shadow:0 0 15px #ff4d6d;
  cursor:pointer;
  transition:0.3s;
}

.videoGrid video:hover{
  transform:scale(1.05);
}

/* PARAGRAPH */
.lovePara{
  text-align:center;
  max-width:600px;
  margin:30px auto;
  padding:0 15px;
  font-size:18px;
  color:#ddd;
}

/* BUTTON */
#nextBtn{
  display:block;
  margin:20px auto;
  padding:12px 25px;
  border:none;
  border-radius:30px;
  background:#ff4d6d;
  color:white;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 15px #ff4d6d;
}

/* POPUP */
#popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  pointer-events:none;
  transition:0.4s;
}

#popup.show{
  opacity:1;
  pointer-events:auto;
}

#popup video{
  width:90%;
  max-width:400px;
  border-radius:15px;
}

/* MOBILE */
@media(max-width:600px){
  .videoGrid{grid-template-columns:repeat(2,1fr);}
  h1{font-size:22px;}
}

/* ANIMATION */
@keyframes fadeIn{
  from{opacity:0; transform:translateY(-20px);}
  to{opacity:1;}
}
</style>
</head>

<body>

<h1>I LOVE YOU ❤️</h1>

<div class="videoGrid">
  <video src="/Bhirtday/assets/1.mp4" autoplay muted loop onclick="openVideo(this)"></video>
  <video src="/Bhirtday/assets/2" autoplay muted loop onclick="openVideo(this)"></video>
  <video src="/Bhirtday/assets/3.mp4" autoplay muted loop onclick="openVideo(this)"></video>
  <video src="/Bhirtday/assets/4.mp4" autoplay muted loop onclick="openVideo(this)"></video>
  <video src="/Bhirtday/assets/5.mp4" autoplay muted loop onclick="openVideo(this)"></video>
  <video src="/Bhirtday/assets/6.mp4" autoplay muted loop onclick="openVideo(this)"></video>
   <video src="/Bhirtday/assets/7.mp4" autoplay muted loop onclick="openVideo(this)"></video>
    <video src="/Bhirtday/assets/8.mp4" autoplay muted loop onclick="openVideo(this)"></video>
     <video src="/Bhirtday/assets/9.mp4" autoplay muted loop onclick="openVideo(this)"></video>
      <video src="/Bhirtday/assets/10.mp4" autoplay muted loop onclick="openVideo(this)"></video>
</div>

<p class="lovePara">
  Tum meri zindagi ka sabse khoobsurat hissa ho ❤️  
  Har din tumhare saath ek nayi khushi lekar aata hai...  
  Main bas itna chahta hoon ki humesha tumhare saath rahun 💖  
  I Love You Forever ♾️  
</p>

<button id="nextBtn">Tap for one last surprise 😈</button>

<!-- POPUP -->
<div id="popup">
  <video id="popupVideo" controls autoplay></video>
</div>

<script>
function openVideo(el){
  const popup = document.getElementById("popup");
  const popupVideo = document.getElementById("popupVideo");
  popupVideo.src = el.src;
  popup.classList.add("show");
}

document.getElementById("popup").onclick = function(e){
  if(e.target.id === "popup"){
    this.classList.remove("show");
    document.getElementById("popupVideo").pause();
  }
};

// NEXT PAGE
document.getElementById("nextBtn").onclick = ()=>{
  window.location.href = "gallery.html";
};
</script>

</body>
</html>
