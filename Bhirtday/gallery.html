<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories ❤️</title>

<style>
body{
  margin:0;
  background:#0f172a;
  font-family:'Segoe UI',sans-serif;
  color:white;
}

/* TITLE */
h1{
  text-align:center;
  padding:20px;
  color:#ff4d6d;
}

/* GRID */
.gallery{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  padding:15px;
}

/* FRAME */
.frame{
  background:white;
  padding:8px;
  border-radius:10px;
  transform:rotate(-2deg);
  transition:0.3s;
}

.frame:nth-child(even){
  transform:rotate(2deg);
}

.frame:hover{
  transform:scale(1.1) rotate(0deg);
}

/* IMAGE */
.frame img{
  width:100%;
  border-radius:5px;
}

/* MOBILE */
@media(max-width:600px){
  .gallery{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<h1>Our Beautiful Memories ❤️</h1>

<div class="gallery">
  <div class="frame"><img src="/Bhirtday/assets/1.jpeg"></div>
  <div class="frame"><img src="/Bhirtday/assets/2.jpeg"></div>
 
</div>

</body>
</html>
